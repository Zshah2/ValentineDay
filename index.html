<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Day Love Quotes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="title">Whispers of My Heart</h1>
        <div class="quote-display">
            <p id="quote">"Love is not about how many days, but how much love you give every day."</p>
        </div>
        <button id="new-quote-btn">Get New Quote</button>
        
        <div class="decorations">
            <!-- Hearts and Flowers Decoration -->
            <div class="hearts"></div>
            <div class="flowers"></div>
        </div>

        <!-- Confetti Decoration -->
        <div class="confetti">
            <div class="confetti-piece"></div>
            <div class="confetti-piece"></div>
            <div class="confetti-piece"></div>
            <div class="confetti-piece"></div>
            <div class="confetti-piece"></div>
            <div class="confetti-piece"></div>
            <div class="confetti-piece"></div>
            <div class="confetti-piece"></div>
            <div class="confetti-piece"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
